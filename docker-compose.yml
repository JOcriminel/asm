services:
  sqlsrv:
    container_name: sqlsrv
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-20.04
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P5v9yast34Iy9qU"
    ports:
      - "1433:1433"
    volumes:
      - ./asm-production/data:/var/opt/mssql/data
      - ./asm-production/sqlserver:/var/opt/mssql/sqlserver
      - ./asm-production/backups:/var/opt/mssql/backups
      - ./asm-production/secrets:/var/opt/mssql/secrets

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm-import.json:/opt/keycloak/data/import/realm-import.json
    restart: always

  backend:
    container_name: backend-app
    build:
      context: ./deploy/dux-integration
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/dux-integration/data:/app/data
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlsrv:1433;databaseName=ASM_PREPROD;encrypt=false;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=P5v9yast34Iy9qU
      - TIMETREE_DB_HOST=sqlsrv
      - TIMETREE_DB_USER=sa
      - TIMETREE_DB_PASS=P5v9yast34Iy9qU
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_WEBSOCKET_BROKER_TYPE=relay
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - TIMETREE_WEBSOCKET_RELAY_STOMP_PORT=61613
    depends_on:
      - sqlsrv
      - keycloak
      - redis
      - rabbitmq
    restart: always

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    restart: always

