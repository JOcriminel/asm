spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer;NON_KEYWORDS=KEY,VALUE;INIT=CREATE SCHEMA IF NOT EXISTS DBO
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Also set the timetree datasource properties
spring.datasource.timetree.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer;NON_KEYWORDS=KEY,VALUE;INIT=CREATE SCHEMA IF NOT EXISTS DBO
spring.datasource.timetree.driverClassName=org.h2.Driver
spring.datasource.timetree.username=sa
spring.datasource.timetree.password=

# Also set the sqlserver datasource properties
sqlserver.datasource.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer;INIT=CREATE SCHEMA IF NOT EXISTS DBO
sqlserver.datasource.username=sa
sqlserver.datasource.password=
sqlserver.datasource.driverClassName=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/master.xml

# Mock Keycloak JWT issuer in tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/DuxWeb
