server:
  port: 9090

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ADMIN_URL:https://duxweb.pre-produx.asmtechtn.com/auth/}realms/${KEYCLOAK_ADMIN_REALM:DuxWeb}
  datasource:
    timetree:
      url: jdbc:sqlserver://${TIMETREE_DB_HOST:sqlsrv}:1433;databaseName=ASM_TIMETREE;encrypt=false;trustServerCertificate=true;
      username: ${TIMETREE_DB_USER:sa}
      password: ${TIMETREE_DB_PASS:P5v9yast34Iy9qU}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  liquibase:
    timetree:
      change-log: classpath:/db/changelog/timetree/master.xml
      default-schema: dbo
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

dux:
  token-url: ${KEYCLOAK_ADMIN_URL:https://duxweb.pre-produx.asmtechtn.com/auth/}realms/${KEYCLOAK_ADMIN_REALM:DuxWeb}/protocol/openid-connect/token
  user-url: ${DUX_USER_URL:https://duxweb.pre-produx.asmtechtn.com/api/Activite/Userbylogin}
  station-url: ${DUX_STATION_URL:https://duxweb.pre-produx.asmtechtn.com/api/Station/viewStation/}
  document-url: ${DUX_DOCUMENT_URL:https://duxweb.pre-produx.asmtechtn.com/api/Document/getDocument/}
  details-doc-url: ${DUX_DETAILS_DOC_URL:https://duxweb.pre-produx.asmtechtn.com/api/DetailsDoc2/}
  client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:asm-apis}
  client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:WIIWVngUsQgSTyXB50AXm1YyeVtaog7V}

timetree:
  websocket:
    rate-limit:
      # 1 event per 2 seconds = 0.5/s
      typing-events-per-second: 0.5
      typing-bucket-capacity: 2
      chat-messages-per-second: 5
      chat-bucket-capacity: 10
    presence:
      session-ttl-seconds: 30
      heartbeat-interval-seconds: 10
      cleanup-interval-ms: 60000
    duplicate-detection:
      ttl-minutes: 5
    offline-queue:
      max-retention-hours: 24
    relay:
      stomp-port: 61613
    upload:
      max-file-size: ${UPLOAD_MAX_SIZE:52428800} # 50MB
      allowed-mime-types: ${UPLOAD_MIME_TYPES:application/pdf,image/png,image/jpeg,image/gif,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain,application/zip}

aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME:dux-attachments}
    region: ${S3_REGION:us-east-1}
    endpoint-override: ${S3_ENDPOINT_OVERRIDE:}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}